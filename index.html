<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/iconW.png" />
    <link rel="apple-touch-icon" href="/img/iconW.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dex — Gestão Jurídica Inteligente com IA</title>
    <meta name="description" content="Plataforma de gestão jurídica modularizada com assistência de Inteligência Artificial para escritórios de advocacia e advogados autônomos." />
    <!-- Google Fonts: DM Serif Display & Lora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <!-- Inicialização instantânea do tema Dex (Previne Flash of White) -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('dex_theme_mode') || 'dark';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (mode === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('theme-light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-dex-cream dark:bg-[#0A1922] text-dex-navy-950 dark:text-[#F9ECE2] antialiased font-serif selection:bg-dex-coral selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
